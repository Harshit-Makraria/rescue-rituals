# Render Blueprint: the API as one free web service.
# Render dashboard → New → Blueprint → pick this repo.
# Database: managed PostgreSQL on Neon (free tier). Paste its connection
# string into DATABASE_URL when Render asks.
services:
  - type: web
    name: events-api
    runtime: node
    plan: free
    region: ohio # same region as Neon (AWS us-east-2) and near Vercel (iad1)
    rootDir: apps/api
    buildCommand: npm install --no-audit --no-fund && npx prisma generate && npm run build
    # Migrations + idempotent demo seed run on every deploy, then the server starts.
    startCommand: npm run render:start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false # Neon *direct* connection string (…neon.tech/neondb?sslmode=require)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL after the web app is deployed
